<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LongFox</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;
        overflow: hidden;
      }
      #game {
        background: #000;
        display: block;
        border: 1px solid #f00;
        touch-action: none;
      }
      #score {
        position: fixed;
        top: 8px;
        right: 12px;
        color: #fff;
        font: bold 32px sans-serif;
        pointer-events: none;
      }
      #gameover {
        display: none;
        position: fixed;
        inset: 0;
        background: #000;
        padding: 24px;
        cursor: pointer;
      }
      #gameover-card {
        background: #333;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 48px;
        padding: 24px;
      }
      #gameover-card img {
        max-width: 210px;
        max-height: 218px;
      }
      #gameover-card p {
        color: #fff;
        font: bold 32px sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="score">Score: 0</div>
    <div id="gameover">
      <div id="gameover-card">
        <img id="gameover-img" src="" alt="you died">
        <p>YOU DIED !!</p>
      </div>
    </div>
    <script>
      const NUM_CELLS = 12;

      class GameState {
        constructor() {
          this.fox = [{x:5,y:5},{x:5,y:4},{x:5,y:3},{x:5,y:2}];
          this.food = {x:8, y:8};
          this.direction = 'DOWN';
          this.score = 0;
          this.isGameOver = false;
          this.beepNext = true;
        }

        get shouldersDirection() {
          if (this.fox.length < 3) return this.direction;
          return dirBetween(this.fox[1], this.fox[2]);
        }

        get tailDirection() {
          if (this.fox.length < 3) return this.direction;
          const n = this.fox.length;
          return dirBetween(this.fox[n - 2], this.fox[n - 3]);
        }

        moveFox() {
          const head = this.fox[0];
          const delta = {UP:{x:0,y:-1}, DOWN:{x:0,y:1}, LEFT:{x:-1,y:0}, RIGHT:{x:1,y:0}}[this.direction];
          const newHead = {x: head.x + delta.x, y: head.y + delta.y};

          if (newHead.x < 0 || newHead.x >= NUM_CELLS || newHead.y < 0 || newHead.y >= NUM_CELLS) {
            this.isGameOver = true;
            return;
          }
          if (this.fox.slice(1).some(s => s.x === newHead.x && s.y === newHead.y)) {
            this.isGameOver = true;
            return;
          }

          const ateFood = newHead.x === this.food.x && newHead.y === this.food.y;
          this.fox = [newHead, ...this.fox];
          if (ateFood) {
            this.score++;
            this.food = this.randomFood();
          } else {
            this.fox.pop();
          }
        }

        onTap(tapX, tapY, cellSize) {
          const head = this.fox[0];
          const headPx = head.x * cellSize + cellSize / 2;
          const headPy = head.y * cellSize + cellSize / 2;
          if (this.direction === 'LEFT' || this.direction === 'RIGHT') {
            this.direction = tapY < headPy ? 'UP' : 'DOWN';
          } else {
            this.direction = tapX < headPx ? 'LEFT' : 'RIGHT';
          }
        }

        randomFood() {
          let pos;
          do {
            pos = {x: Math.floor(Math.random() * NUM_CELLS), y: Math.floor(Math.random() * NUM_CELLS)};
          } while (this.fox.some(s => s.x === pos.x && s.y === pos.y));
          return pos;
        }
      }

      function dirBetween(a, b) {
        if (a.y < b.y) return 'UP';
        if (a.y > b.y) return 'DOWN';
        if (a.x < b.x) return 'LEFT';
        return 'RIGHT';
      }

      class AudioEngine {
        constructor() {
          this.ctx = null;
        }

        _ensure() {
          if (!this.ctx) this.ctx = new AudioContext();
        }

        _tone(freq, duration, type = 'sine', gain = 0.3, startDelay = 0) {
          this._ensure();
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.type = type;
          osc.frequency.value = freq;
          const start = this.ctx.currentTime + startDelay;
          g.gain.setValueAtTime(gain, start);
          g.gain.exponentialRampToValueAtTime(0.001, start + duration);
          osc.start(start);
          osc.stop(start + duration);
        }

        playBeep() { this._tone(440, 0.08); }
        playBoop() { this._tone(330, 0.08); }

        playEat() {
          this._tone(523, 0.1);
          this._tone(659, 0.12, 'sine', 0.3, 0.08);
        }

        playSadWobble() {
          this._ensure();
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.type = 'sine';
          const t = this.ctx.currentTime;
          osc.frequency.setValueAtTime(400, t);
          osc.frequency.linearRampToValueAtTime(200, t + 0.6);
          osc.frequency.setValueAtTime(220, t + 0.6);
          osc.frequency.linearRampToValueAtTime(150, t + 1.0);
          g.gain.setValueAtTime(0.3, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
          osc.start(t);
          osc.stop(t + 1.0);
        }
      }

        return 'data:image/svg+xml,' + encodeURIComponent(svg);
      }

      const headImg = new Image();
      headImg.src = svgUrl(kitHeadSvg);

      const tailImg = new Image();
      tailImg.src = svgUrl(kitTailSvg);

      document.getElementById('gameover-img').src = svgUrl(firefoxSvg);

      const canvas = document.getElementById('game');
      const scoreEl = document.getElementById('score');
      const gameoverEl = document.getElementById('gameover');

      let state = new GameState();
      const audio = new AudioEngine();
      let cellSize = 0;

      function resize() {
        const size = Math.min(window.innerWidth, window.innerHeight);
        canvas.width = canvas.height = size;
        cellSize = size / NUM_CELLS;
      }

      function tick() {
        if (state.isGameOver) return;
        const oldScore = state.score;
        state.moveFox();
        if (state.score > oldScore) {
          audio.playEat();
        } else {
          state.beepNext ? audio.playBeep() : audio.playBoop();
          state.beepNext = !state.beepNext;
        }
        if (state.isGameOver) {
          audio.playSadWobble();
          gameoverEl.style.display = 'block';
        }
        draw();
        scoreEl.textContent = 'Score: ' + state.score;
      }

      function draw() {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // food
        ctx.fillStyle = '#00ff00';
        ctx.fillRect(state.food.x * cellSize, state.food.y * cellSize, cellSize, cellSize);

        // body (excluding head and tail)
        const body = state.fox.slice(1, -1);
        if (body.length > 0) {
          const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          grad.addColorStop(0, '#ff0000');
          grad.addColorStop(1, '#ffff00');
          ctx.fillStyle = grad;
          for (const seg of body) {
            ctx.fillRect(seg.x * cellSize, seg.y * cellSize, cellSize, cellSize);
          }
        }

        // tail sprite (rotated)
        const tail = state.fox[state.fox.length - 1];
        const tailRot = {UP: 0, RIGHT: Math.PI/2, DOWN: Math.PI, LEFT: -Math.PI/2}[state.tailDirection];
        const tx = tail.x * cellSize + cellSize / 2;
        const ty = tail.y * cellSize + cellSize / 2;
        ctx.save();
        ctx.translate(tx, ty);
        ctx.rotate(tailRot);
        ctx.drawImage(tailImg, -cellSize / 2, -cellSize / 2, cellSize, cellSize);
        ctx.restore();

        // head sprite (no rotation)
        const head = state.fox[0];
        ctx.drawImage(headImg, head.x * cellSize, head.y * cellSize, cellSize, cellSize);
      }

      canvas.addEventListener('pointerdown', e => {
        if (state.isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        state.onTap((e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY, cellSize);
      });

      document.addEventListener('keydown', e => {
        const map = {ArrowUp:'UP', ArrowDown:'DOWN', ArrowLeft:'LEFT', ArrowRight:'RIGHT',
                     w:'UP', s:'DOWN', a:'LEFT', d:'RIGHT'};
        const newDir = map[e.key];
        if (!newDir) return;
        const opposites = {UP:'DOWN', DOWN:'UP', LEFT:'RIGHT', RIGHT:'LEFT'};
        if (newDir !== opposites[state.direction]) state.direction = newDir;
      });

      gameoverEl.addEventListener('click', () => {
        state = new GameState();
        scoreEl.textContent = 'Score: 0';
        gameoverEl.style.display = 'none';
        draw();
      });

      window.addEventListener('resize', () => { resize(); draw(); });

      resize();
      draw();
      setInterval(tick, 160);
</script>
